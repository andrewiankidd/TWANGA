[package]
name = "twanga-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "TWANGA CLI — tune, record, play, patterns, tunings, docs, devices, convert."
publish = false

[[bin]]
name = "twanga"
path = "src/main.rs"

# A tiny lib alongside the bin so integration tests in `tests/` can
# pull in the WAV synthesizer + sample-source trait without
# duplicating ~80 lines of WAV writer code. The lib re-exports only
# the modules the test harness genuinely needs; everything else
# stays bin-local in `main.rs`.
[lib]
name = "twanga_cli"
path = "src/lib.rs"

[dependencies]
twanga-core = { path = "../twanga-core" }
twanga-audio = { path = "../twanga-audio" }
twanga-dsp = { path = "../twanga-dsp" }
twanga-synth = { path = "../twanga-synth" }
twanga-tabs = { path = "../twanga-tabs" }
twanga-tui = { path = "../twanga-tui" }
twanga-paths = { path = "../twanga-paths" }
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
