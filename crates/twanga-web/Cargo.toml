[package]
name = "twanga-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WASM bindings: exposes twanga-core / twanga-dsp / twanga-tabs to the browser frontend."

[lib]
# cdylib so wasm-bindgen can post-process the binary; rlib so the workspace can
# still link it from a future host crate if useful.
crate-type = ["cdylib", "rlib"]

[dependencies]
twanga-core = { path = "../twanga-core" }
twanga-dsp = { path = "../twanga-dsp" }
twanga-tabs = { path = "../twanga-tabs" }
wasm-bindgen = "0.2.121"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
    # Enough to read the audio context + getUserMedia later; harmless to opt
    # into now so the API surface is set in stone for downstream JS.
    "console",
]
