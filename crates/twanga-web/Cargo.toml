[package]
name = "twanga-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WASM bindings: exposes twanga-core / twanga-dsp / twanga-tabs to the browser frontend."
publish = false

[lib]
# cdylib so wasm-bindgen can post-process the binary; rlib so the workspace can
# still link it from a future host crate if useful.
crate-type = ["cdylib", "rlib"]

[dependencies]
twanga-core = { path = "../twanga-core" }
twanga-dsp = { path = "../twanga-dsp" }
twanga-tabs = { path = "../twanga-tabs" }
wasm-bindgen = "0.2.121"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
# `js-sys`, `web-sys` will be re-added once the WASM bridge actually needs
# them (direct DOM access from Rust / Web Audio bindings written in Rust
# rather than JS). Today the bridge exposes only twanga-core / twanga-dsp
# / twanga-tabs surfaces, so machete flags them.
