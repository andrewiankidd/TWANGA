name: Dependabot auto-merge

# Auto-merges Dependabot PRs that bump dependencies by a PATCH version only
# (semver patch — `1.0.5` → `1.0.6`). Minor and major bumps still come as
# regular PRs for human review.
#
# IMPORTANT: this uses `gh pr merge --auto`, which queues the merge to
# happen "after all required status checks pass." For that gate to actually
# mean "after CI passes," `main` needs branch protection with the CI jobs
# (Check + fmt (linux), Test (ubuntu-latest|windows-latest|macos-latest))
# marked as required status checks. Without that protection, auto-merge
# fires immediately — the bump merges before CI even finishes. Set it up
# at Settings → Branches → Add branch protection rule for `main`. You can
# leave "Require a pull request" unchecked so direct pushes to main still
# work for you; only "Require status checks to pass" matters here.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
