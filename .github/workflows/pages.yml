name: Deploy web → GitHub Pages

# Builds the WASM bridge + uploads the static frontend (frontend/web/) to
# GitHub Pages on every push to main. Pages is configured in `workflow`
# build mode (set once via `gh api repos/.../pages -X POST -f build_type=workflow`),
# so no `gh-pages` branch exists — the artifact is consumed directly by
# actions/deploy-pages. Cleaner than tinnedspaghetti's gh-pages-branch
# approach because we're not also pushing release binaries through the
# same workflow (those go through `release.yml` and the GitHub Releases
# API instead).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy runs at a time. If a new push comes in mid-deploy,
# cancel the in-flight one — we want main to always end up matching the
# deployed site, not race against itself.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM + frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: pages

      # Prebuilt wasm-bindgen-cli — cargo install takes 3-5 min from source.
      # Version must match the wasm-bindgen crate version in twanga-web's
      # Cargo.toml or the generated JS glue won't link against the binary.
      - name: Install wasm-bindgen-cli (prebuilt)
        run: |
          VERSION=0.2.121
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz
          sudo mv "wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version

      - name: Build twanga-web (release)
        run: cargo build --target wasm32-unknown-unknown -p twanga-web --release

      - name: Generate JS glue + post-process wasm
        run: |
          mkdir -p frontend/web/pkg
          wasm-bindgen --target web \
            --out-dir frontend/web/pkg \
            target/wasm32-unknown-unknown/release/twanga_web.wasm
          ls -lh frontend/web/pkg/

      # The bundled alphaTex examples + patterns live at `assets/`
      # (so the CLI can play them via `twanga play assets/examples/...`
      # or `assets/patterns/...`), but the browser library fetches
      # them relative to the deploy root. Pages only uploads
      # `frontend/web/`, so we copy them into the bundle here. Same
      # gitignored-build-artifact pattern as `frontend/web/pkg/`.
      - name: Bundle alphaTex examples + patterns into the site
        run: |
          mkdir -p frontend/web/assets
          cp -r assets/examples frontend/web/assets/
          cp -r assets/patterns frontend/web/assets/
          ls -lh frontend/web/assets/examples/
          ls -lh frontend/web/assets/patterns/

      # Per-feature docs (docs/features/*.md) are the source of truth for
      # both the in-app docs viewer (`#docs/<slug>`) and the CLI's
      # `twanga docs <slug>` subcommand. The viewer fetches them via
      # `assets/docs/<slug>.md` relative to the deploy root, so copy
      # them into the bundle here. The CLI embeds the same files
      # directly via `include_str!` at build time. Keep the
      # destination name (`docs/`) in sync with the equivalent step in
      # release.yml.
      - name: Bundle per-feature docs into the site
        run: |
          cp -r docs/features frontend/web/assets/docs
          ls -lh frontend/web/assets/docs/

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
