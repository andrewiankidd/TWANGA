name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check + fmt + clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (audio + Tauri webview)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Same lint gate the pre-push hook enforces; CI is the safety net.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets

  lint:
    # Static-analysis pass that doesn't need the Rust toolchain to compile
    # the project — license/advisory/unused-dep checks read Cargo.lock /
    # Cargo.toml directly. Kept separate so the heavier `check` job above
    # doesn't have to also bring these tools in.
    name: Audit + deny + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny (license + ban + dup + advisories)
        # Reads deny.toml at the repo root. License allow-list is intentional;
        # adding a license requires a deliberate edit.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Install cargo-machete (prebuilt binary)
        run: |
          VERSION=0.7.0
          curl -sL "https://github.com/bnjbvr/cargo-machete/releases/download/v${VERSION}/cargo-machete-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz
          sudo mv "cargo-machete-v${VERSION}-x86_64-unknown-linux-musl/cargo-machete" /usr/local/bin/
          cargo-machete --version
      - name: cargo-machete (unused dependencies)
        run: cargo-machete

  wasm-bridge:
    # Build the WASM bundle and verify every JS call into it resolves
    # to a declared export. Catches the "Rust added a #[wasm_bindgen]
    # method, JS already calls it, but the local pkg/ on someone's
    # machine is stale" failure mode that Rust tests + clippy don't
    # see (Rust tests exercise the Rust API, not the bindgen export
    # surface). Cheap (~30 s) and Linux-only.
    name: Frontend WASM bridge surface check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-bridge
      # Same prebuilt-binary install pattern as pages.yml — version
      # must match the wasm-bindgen crate version in twanga-web's
      # Cargo.toml or the .d.ts shape can shift between releases.
      - name: Install wasm-bindgen-cli (prebuilt)
        run: |
          VERSION=0.2.121
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz
          sudo mv "wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version
      - name: Build twanga-web (release)
        run: cargo build --target wasm32-unknown-unknown -p twanga-web --release
      - name: Generate JS glue + .d.ts
        run: |
          mkdir -p frontend/web/pkg
          wasm-bindgen --target web \
            --out-dir frontend/web/pkg \
            target/wasm32-unknown-unknown/release/twanga_web.wasm
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify JS calls resolve to declared WASM exports
        run: node tools/check-wasm-bridge.mjs

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Linux runners need the audio (alsa) + Tauri (webkit, gtk, soup, etc.)
      # system libraries before any cargo invocation that touches twanga-audio
      # or twanga-app. Windows ships WebView2 by default; macOS uses system
      # WebKit; neither needs anything extra.
      - name: Install system deps (audio + Tauri webview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace

      # Frontend JS smoke tests — Node's built-in `node:test` runner with
      # glob support (added in Node 21). ubuntu-latest still defaults to
      # Node 20, so pin a current version explicitly. Currently just
      # `markdown.js` (the docs renderer); add more `*.test.js` files
      # alongside the modules they cover.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Node test (frontend JS)
        run: node --test "frontend/web/**/*.test.js"
