name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check + fmt + clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (audio + Tauri webview)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Same lint gate the pre-push hook enforces; CI is the safety net.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets

  lint:
    # Static-analysis pass that doesn't need the Rust toolchain to compile
    # the project — license/advisory/unused-dep checks read Cargo.lock /
    # Cargo.toml directly. Kept separate so the heavier `check` job above
    # doesn't have to also bring these tools in.
    name: Audit + deny + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny (license + ban + dup + advisories)
        # Reads deny.toml at the repo root. License allow-list is intentional;
        # adding a license requires a deliberate edit.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Install cargo-machete (prebuilt binary)
        run: |
          VERSION=0.7.0
          curl -sL "https://github.com/bnjbvr/cargo-machete/releases/download/v${VERSION}/cargo-machete-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz
          sudo mv "cargo-machete-v${VERSION}-x86_64-unknown-linux-musl/cargo-machete" /usr/local/bin/
          cargo-machete --version
      - name: cargo-machete (unused dependencies)
        run: cargo-machete

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Linux runners need the audio (alsa) + Tauri (webkit, gtk, soup, etc.)
      # system libraries before any cargo invocation that touches twanga-audio
      # or twanga-app. Windows ships WebView2 by default; macOS uses system
      # WebKit; neither needs anything extra.
      - name: Install system deps (audio + Tauri webview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace

      # Frontend JS smoke tests — Node 18+'s built-in `node:test` runner,
      # no install needed (Node is pre-provisioned on GitHub runners).
      # Currently just `markdown.js` (the docs renderer); add more
      # `*.test.js` files alongside the modules they cover. The glob
      # form is portable across Node versions; passing a bare directory
      # path tries to load it as a single module.
      - name: Node test (frontend JS)
        run: node --test "frontend/web/**/*.test.js"
