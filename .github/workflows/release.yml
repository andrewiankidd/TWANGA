name: Release

# Three trigger paths:
#   - push to main         → build everything, no draft release (CI-style "does it still build?")
#   - push to v* tag       → build everything AND create a draft GH Release
#   - workflow_dispatch    → manual run; create a draft release with the input tag
#
# The build matrix runs on all three; the `release` aggregator at the
# bottom is gated on tag/dispatch so a regular commit doesn't litter the
# Releases page with one draft per push.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Must already exist or be valid for a fresh draft.'
        required: true

# Per-ref concurrency. Group keyed on github.ref so main pushes share a
# bucket (newer commit cancels the older in-flight run, avoids stacking
# 10-job matrix runs while iterating) and each tag gets its own bucket
# (one tag = one release build, never cancel itself).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pin wasm-bindgen-cli to whatever the twanga-web Cargo.toml uses. The
  # CLI version and the crate version must agree or the generated JS
  # glue won't link. Bump this in lockstep with the crate.
  WASM_BINDGEN_VERSION: '0.2.121'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Per-platform build — produces BOTH the CLI archive and the Tauri
  # desktop installer in a single job. Combined because `cargo tauri
  # build` already compiles the entire workspace (it pulls in twanga-cli
  # via the workspace), so running `cargo build -p twanga-cli` in the
  # same job is nearly free thanks to incremental compilation. Saves a
  # whole duplicate toolchain install + cache restore per platform
  # versus splitting into two jobs.
  #
  # Each job uploads two artifact names (`twanga-${friendly}` for the
  # CLI archive, `twanga-desktop-${friendly}` for the installers), which
  # the aggregator's `download-artifact` step pulls together via
  # `merge-multiple: true`.
  # ─────────────────────────────────────────────────────────────────────
  build-platform:
    name: 🏗️ Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `friendly` is the stable, user-facing slug used for the archive
          # filename (so `releases/latest/download/twanga-windows.zip` resolves
          # the same URL release-to-release). The `target` triple is still in
          # the extracted directory name + tagged into the release notes.
          # `friendly` is the user-facing slug; `targets` is the full set
          # of Rust targets to install via rustup (comma-separated as
          # dtolnay/rust-toolchain expects); `cli_target` is the single
          # triple `cargo build -p twanga-cli` builds against; `tauri_target`
          # is what `cargo tauri build --target ...` builds. On macOS,
          # tauri_target = `universal-apple-darwin` produces ONE DMG that
          # runs natively on both Intel and Apple Silicon — and the CLI
          # build is universalised via `lipo` in the staging step. End
          # result: three platform entries instead of four, with the
          # macos-13 Intel runner (which has multi-hour queues now that
          # GitHub is winding it down) dropped entirely.
          - name: 'Windows 🪟'
            cli_target: x86_64-pc-windows-msvc
            tauri_target: x86_64-pc-windows-msvc
            targets: 'x86_64-pc-windows-msvc'
            os: windows-latest
            archive: zip
            bin: twanga.exe
            bundles: 'msi,nsis'
            friendly: windows
          - name: 'Linux 🐧'
            cli_target: x86_64-unknown-linux-gnu
            tauri_target: x86_64-unknown-linux-gnu
            targets: 'x86_64-unknown-linux-gnu'
            os: ubuntu-latest
            archive: tar.gz
            bin: twanga
            bundles: 'deb,appimage'
            friendly: linux
          - name: 'macOS 🍎'
            cli_target: aarch64-apple-darwin
            tauri_target: universal-apple-darwin
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            os: macos-latest
            archive: tar.gz
            bin: twanga
            # `app,dmg` rather than just `dmg` because Tauri deletes the
            # intermediate `TWANGA.app` after wrapping it into the DMG
            # when only `dmg` is requested. Asking for both keeps the
            # .app around so we can tar it as the portable artifact.
            bundles: 'app,dmg'
            friendly: macos

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install Linux deps (audio + Tauri)
        if: runner.os == 'Linux'
        run: |
          # libasound2-dev is needed by twanga-audio (CLI); the rest are
          # Tauri's GTK/WebKit prereqs. Combined into one apt-get call.
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
              libayatana-appindicator3-dev librsvg2-dev libasound2-dev build-essential

      - name: 🦀 Set up Rust (native + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }},wasm32-unknown-unknown

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.friendly }}

      - name: 🏷️ Resolve tag + artifact names
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Main-branch push — synthesise a label from the short SHA so
            # artifact filenames + the archive root dir stay sane. The
            # rolling `latest-main` release uses these as its uploaded
            # files regardless of this label; the label is just for the
            # archive's internal staging dir.
            tag="main-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          # `staged` keeps the version + platform visible inside the CLI
          # archive (extracted dir tells you which release you grabbed).
          # `cli_archive` + `desktop_archive` are the stable user-facing
          # filenames (latest-download URL stays the same release-to-
          # release).
          staged="twanga-${tag}-${{ matrix.friendly }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          # Artifact names follow `twanga-{component}-{platform}.{ext}`
          # so the Releases page sorts naturally and a glance tells you
          # which file is what. The extension carries portable-vs-
          # installer.
          echo "cli_archive=twanga-cli-${{ matrix.friendly }}" >> "$GITHUB_OUTPUT"
          echo "desktop_archive=twanga-desktop-${{ matrix.friendly }}" >> "$GITHUB_OUTPUT"

      # ── CLI build + pack ────────────────────────────────────────────
      # CLI first because it's the smaller of the two and its deps are a
      # strict subset of Tauri's — building it primes the workspace cache
      # for the Tauri step that follows.

      - name: 🏗️ Build twanga-cli (primary target)
        run: cargo build --release --target ${{ matrix.cli_target }} -p twanga-cli

      - name: 🏗️ Build twanga-cli (macOS Intel for universal lipo)
        if: matrix.friendly == 'macos'
        run: cargo build --release --target x86_64-apple-darwin -p twanga-cli

      - name: 📁 Stage CLI archive contents
        shell: bash
        run: |
          staged="${{ steps.meta.outputs.staged }}"
          dir="dist-cli/$staged"
          mkdir -p "$dir/examples"
          if [ "${{ matrix.friendly }}" = "macos" ]; then
            # Fuse the two single-arch binaries into one universal binary
            # that runs natively on both Intel and Apple Silicon. macOS
            # has shipped `lipo` since forever; no install needed.
            lipo -create \
                "target/aarch64-apple-darwin/release/${{ matrix.bin }}" \
                "target/x86_64-apple-darwin/release/${{ matrix.bin }}" \
                -output "$dir/${{ matrix.bin }}"
          else
            cp "target/${{ matrix.cli_target }}/release/${{ matrix.bin }}" "$dir/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp assets/examples/*.alphatex "$dir/examples/"

      - name: 🗜️ Pack CLI zip
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: dist-cli
        run: Compress-Archive -Path "${{ steps.meta.outputs.staged }}" -DestinationPath "${{ steps.meta.outputs.cli_archive }}.zip"

      - name: 🗜️ Pack CLI tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        working-directory: dist-cli
        run: tar -czf "${{ steps.meta.outputs.cli_archive }}.tar.gz" "${{ steps.meta.outputs.staged }}"

      - name: ⬆️ Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.cli_archive }}
          path: dist-cli/${{ steps.meta.outputs.cli_archive }}.${{ matrix.archive }}
          if-no-files-found: error

      # ── Desktop / Tauri build + pack ────────────────────────────────
      # Reuses the same `target/` dir the CLI build just populated, so
      # workspace deps (twanga-core, -dsp, -audio, -tabs, -tui) are
      # already compiled. Only the Tauri-specific crates + wasm32 need
      # fresh compilation.

      - name: 📦 Install wasm-bindgen-cli (prebuilt where possible)
        shell: bash
        run: |
          # Same pinned-version dance the pages.yml workflow uses — the
          # wasm-bindgen binary must match the crate version in
          # twanga-web's Cargo.toml or the generated JS won't link.
          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
            sudo mv "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          else
            cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
          fi
          wasm-bindgen --version

      - name: 🛠️ Build twanga-web (WASM)
        run: cargo build --target wasm32-unknown-unknown -p twanga-web --release

      - name: ⚙️ Generate JS glue + post-process wasm
        shell: bash
        run: |
          wasm-bindgen --target web --out-dir frontend/web/pkg \
              target/wasm32-unknown-unknown/release/twanga_web.wasm

      - name: 📁 Bundle alphaTex examples + patterns into the site
        shell: bash
        run: |
          # Same step pages.yml does — the browser library fetches these
          # relative to the deploy root, Tauri bundles them into the app
          # via `frontendDist`.
          mkdir -p frontend/web/assets
          cp -r assets/examples frontend/web/assets/
          cp -r assets/patterns frontend/web/assets/

      - name: 📦 Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: 🏗️ Build Tauri bundle
        working-directory: crates/twanga-app
        run: cargo tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.tauri_target }}

      - name: 🔏 Verify macOS ad-hoc signature
        if: matrix.friendly == 'macos'
        # Belt-and-braces: tauri.conf.json's bundle.macOS.signingIdentity
        # = "-" should have made cargo tauri build ad-hoc sign the .app
        # during the bundle step (which is critical because the .dmg
        # wraps the signed .app — signing AFTER the build would leave
        # the DMG copy unsigned). This step verifies the signature
        # exists and re-signs if it somehow didn't.
        run: |
          set -e
          bundle_root="target/${{ matrix.tauri_target }}/release/bundle"
          for app in "$bundle_root"/macos/*.app; do
              if ! codesign --verify --deep --strict "$app" 2>/dev/null; then
                  echo "::warning::no signature on $app — applying ad-hoc fallback"
                  codesign --force --deep --sign - "$app"
              fi
              codesign --verify --deep --strict "$app"
              echo "verified: $app"
          done

      - name: 📁 Stage Tauri installers + portable bundles
        shell: bash
        run: |
          # Two-pass naming: every installer gets `-setup` in the name
          # for consistency (so .msi and .exe sit next to each other
          # under twanga-desktop-windows-setup.{msi,exe} rather than
          # leaving the .msi looking like a portable binary). The raw
          # unpacked artefacts cargo tauri build already produces are
          # repacked alongside as `-portable` for users who don't want
          # to run an installer.
          #
          # Layout per platform:
          #   Windows: setup.msi + setup.exe (NSIS) + portable.zip
          #   Linux:   setup.deb + portable.AppImage
          #   macOS:   setup.dmg + portable.app.tar.gz
          mkdir -p dist-desktop
          bundle_root="target/${{ matrix.tauri_target }}/release/bundle"
          release_root="target/${{ matrix.tauri_target }}/release"
          friendly="${{ matrix.friendly }}"

          # ── Pass 1: bundled installers, renamed with -setup ─────────
          if [ -d "$bundle_root" ]; then
            while IFS= read -r src; do
              base="$(basename "$src")"
              case "$base" in
                  *.msi)         dst="twanga-desktop-${friendly}-setup.msi" ;;
                  *.exe)         dst="twanga-desktop-${friendly}-setup.exe" ;;
                  *.dmg)         dst="twanga-desktop-${friendly}-setup.dmg" ;;
                  *.deb)         dst="twanga-desktop-${friendly}-setup.deb" ;;
                  *.rpm)         dst="twanga-desktop-${friendly}-setup.rpm" ;;
                  # AppImage is portable by design — name accordingly so
                  # it sits in the portable column on the Releases page.
                  *.AppImage)    dst="twanga-desktop-${friendly}-portable.AppImage" ;;
                  *)             dst="$base" ;;
              esac
              cp "$src" "dist-desktop/${dst}"
              echo "  $base → $dst"
            done < <(find "$bundle_root" -type f \( -name '*.msi' -o -name '*.exe' \
                -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) )
          fi

          # ── Pass 2: portable variants from the unpacked release output
          case "$friendly" in
              windows)
                  # The raw GUI binary lives alongside `bundle/`. Wrap it
                  # in a tiny zip with README + licenses for context.
                  stage="dist-desktop-portable/twanga-desktop"
                  mkdir -p "$stage"
                  cp "${release_root}/twanga-app.exe" "$stage/"
                  cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
                  (cd dist-desktop-portable && \
                      powershell -Command "Compress-Archive -Path twanga-desktop -DestinationPath ../dist-desktop/twanga-desktop-windows-portable.zip")
                  ;;
              macos)
                  # The .app bundle Tauri produces *before* it wraps it
                  # in the DMG IS the portable form — drag-and-drop to
                  # /Applications or anywhere else. tar.gz preserves the
                  # executable bit + the bundle's internal structure.
                  app_dir="${bundle_root}/macos"
                  app="$(find "$app_dir" -maxdepth 1 -type d -name '*.app' | head -n 1 || true)"
                  if [ -n "$app" ]; then
                      tar -czf "dist-desktop/twanga-desktop-macos-portable.app.tar.gz" \
                          -C "$(dirname "$app")" "$(basename "$app")"
                      echo "  $(basename "$app") → twanga-desktop-macos-portable.app.tar.gz"
                  fi
                  ;;
              linux)
                  # AppImage already covered by the rename above — there's
                  # nothing further to do here. The raw ELF binary would
                  # need libwebkit2gtk-4.1 on the host so it's not really
                  # "portable"; AppImage is the right shape.
                  :
                  ;;
          esac
          ls -lh dist-desktop/ || true

      - name: ⬆️ Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.desktop_archive }}
          path: dist-desktop/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Android build — debug-signed APK + AAB. The keystore for release
  # signing lives in repository secrets (TWANGA_ANDROID_KEYSTORE_B64
  # etc.) when we have one; until then `cargo tauri android build`
  # produces an APK signed with Android's universal debug key, which is
  # fine for sideloading + initial validation but won't be Play Store
  # acceptable.
  #
  # continue-on-error so a flaky Android run doesn't block the desktop
  # + CLI release. Mobile is best-effort right now.
  # ─────────────────────────────────────────────────────────────────────
  build-android:
    name: 📱 Mobile Android 🤖
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: 🦀 Set up Rust (Android targets + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android, wasm32-unknown-unknown

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: 📦 Install wasm-bindgen-cli (prebuilt)
        run: |
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/

      - name: 🛠️ Build twanga-web (WASM) + assets
        run: |
          cargo build --target wasm32-unknown-unknown -p twanga-web --release
          wasm-bindgen --target web --out-dir frontend/web/pkg \
              target/wasm32-unknown-unknown/release/twanga_web.wasm
          mkdir -p frontend/web/assets
          cp -r assets/examples frontend/web/assets/
          cp -r assets/patterns frontend/web/assets/

      - name: 📦 Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: 🌱 Initialise Tauri Android project
        working-directory: crates/twanga-app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: cargo tauri android init

      - name: 🏗️ Build Android APK (debug-signed)
        working-directory: crates/twanga-app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        # `--debug` builds with Android's auto-generated debug keystore.
        # Without it, cargo tauri android build defaults to release
        # mode and produces an UNSIGNED APK that Android refuses to
        # install ("package appears to be invalid"). Debug-signed is
        # fine for sideloading and dev distribution; switching to a
        # real release keystore is a future step that needs the cert
        # + password in repo secrets.
        run: cargo tauri android build --apk --debug

      - name: 🏷️ Resolve tag + artifact name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Main-branch push — synthesise a label from the short SHA so
            # artifact filenames + the archive root dir stay sane. The
            # rolling `latest-main` release uses these as its uploaded
            # files regardless of this label; the label is just for the
            # archive's internal staging dir.
            tag="main-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=twanga-mobile-android" >> "$GITHUB_OUTPUT"

      - name: 📁 Stage APKs
        run: |
          mkdir -p dist
          # cargo tauri android build drops APKs under the project's
          # gen/ dir with internal names like
          # `app-universal-release-unsigned.apk`. Rename to the same
          # `twanga-mobile-android.apk` shape the other components use
          # so the Releases page is skimmable. If there are multiple
          # APKs (per-arch + universal), the universal one wins.
          src_apks=()
          while IFS= read -r apk; do
              src_apks+=("$apk")
          done < <(find crates/twanga-app/gen/android -type f -name '*.apk')
          if [ ${#src_apks[@]} -eq 0 ]; then
              echo "::error::Android build produced no .apk — failing job."
              exit 1
          fi
          # Prefer a universal APK if present, otherwise take the first.
          chosen=""
          for apk in "${src_apks[@]}"; do
              case "$apk" in *universal*) chosen="$apk"; break ;; esac
          done
          [ -z "$chosen" ] && chosen="${src_apks[0]}"
          cp "$chosen" "dist/twanga-mobile-android.apk"
          ls -lh dist/

      - name: ⬆️ Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive }}
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # iOS build — best-effort. Without an Apple Developer team ID and a
  # provisioning profile in repository secrets, `cargo tauri ios build`
  # cannot produce a signed .ipa installable on real devices. What we
  # CAN verify in CI is that the project initialises + the simulator
  # build compiles, which is the main "does it build at all" question.
  # Release-signed iOS shipping is a separate piece of work that wants
  # certs + secrets + a proper signing pipeline.
  # ─────────────────────────────────────────────────────────────────────
  build-ios:
    name: 📱 Mobile iOS 🍏
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🦀 Set up Rust (iOS targets + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, wasm32-unknown-unknown

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-ios

      - name: 📦 Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: 🛠️ Build twanga-web (WASM) + assets
        run: |
          cargo build --target wasm32-unknown-unknown -p twanga-web --release
          wasm-bindgen --target web --out-dir frontend/web/pkg \
              target/wasm32-unknown-unknown/release/twanga_web.wasm
          mkdir -p frontend/web/assets
          cp -r assets/examples frontend/web/assets/
          cp -r assets/patterns frontend/web/assets/

      - name: 📦 Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: 🌱 Initialise Tauri iOS project
        working-directory: crates/twanga-app
        run: cargo tauri ios init

      - name: 🏗️ Build iOS (simulator target, unsigned)
        working-directory: crates/twanga-app
        # No signing config yet, so production .ipa packaging will fail
        # — we build for the simulator target instead, which doesn't
        # need a provisioning profile. `cargo tauri ios build`'s
        # `--target` takes the Tauri shorthand (`aarch64-sim` /
        # `aarch64` / `x86_64`), not the rustc triple
        # (`aarch64-apple-ios-sim`). The build is allowed to fail at
        # the job level via `continue-on-error: true` (Mobile is best-
        # effort), but we no longer swallow the result with `|| true`
        # so genuine failures show as red rather than fake-passing.
        run: cargo tauri ios build --target aarch64-sim

      - name: 🏷️ Resolve tag + artifact name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Main-branch push — synthesise a label from the short SHA so
            # artifact filenames + the archive root dir stay sane. The
            # rolling `latest-main` release uses these as its uploaded
            # files regardless of this label; the label is just for the
            # archive's internal staging dir.
            tag="main-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=twanga-mobile-ios" >> "$GITHUB_OUTPUT"

      - name: 📁 Stage iOS artefacts
        run: |
          mkdir -p dist
          # cargo tauri ios build --target aarch64-apple-ios-sim drops a
          # `TWANGA.app` *directory* under gen/apple/build/... — we tar
          # the .app bundle (single file for GH artifact upload). Once
          # signing is wired we'll prefer the .ipa. Naming follows the
          # same `twanga-mobile-{platform}.{ext}` shape as the rest of
          # the release.
          found=0
          while IFS= read -r app; do
              # Only stage the *first* .app — there's typically just one
              # (TWANGA.app), and naming would conflict otherwise.
              if [ "$found" = "0" ]; then
                  tar -czf "dist/twanga-mobile-ios-simulator.app.tar.gz" \
                      -C "$(dirname "$app")" "$(basename "$app")"
                  found=1
              fi
          done < <(find crates/twanga-app/gen/apple/build -type d -name '*.app' 2>/dev/null)
          # Pick up an .ipa if a signed build somehow produced one.
          ipa="$(find crates/twanga-app/gen/apple -type f -name '*.ipa' | head -n 1 || true)"
          if [ -n "$ipa" ]; then
              cp "$ipa" "dist/twanga-mobile-ios.ipa"
          fi
          ls -lh dist/
          if [ "$found" = "0" ] && [ -z "$ipa" ]; then
              echo "::error::iOS build produced no .app or .ipa — failing job."
              exit 1
          fi

      - name: ⬆️ Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive }}
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Two aggregators, gated by trigger:
  #
  #   release-tag      — fires on `v*` tag push or workflow_dispatch.
  #                      Creates a draft, versioned GH Release named after
  #                      the tag, ready to be reviewed + published.
  #
  #   release-rolling  — fires on every push to main. Refreshes a single
  #                      `latest-main` pre-release with the freshly-built
  #                      artefacts. Marked prerelease + make_latest:false
  #                      so it doesn't displace the "Latest" badge on the
  #                      Releases page (that stays pinned to the most
  #                      recent versioned tag).
  #
  # Both depend only on `build-platform` (CLI + Desktop combined) so a
  # flaky Android / iOS run doesn't block the release going out — those
  # artefacts just won't be attached this time around.
  # ─────────────────────────────────────────────────────────────────────

  release-tag:
    name: 🎁 Publish draft release (tag)
    # `if: always() && ...` so we still run when Android/iOS fail
    # (continue-on-error). The success gate stays on build-platform —
    # CLI + Desktop must compile for there to be anything worth shipping.
    if: |
      always() && needs.build-platform.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-platform, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 📦 Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TWANGA ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*

  release-rolling:
    name: 🔄 Refresh latest-main release
    # `if: always() && ...` so the mobile builds finishing (or failing —
    # continue-on-error) doesn't skip this job. The success gate stays
    # on build-platform because CLI + Desktop must compile for there
    # to be anything worth shipping.
    if: |
      always() && needs.build-platform.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-platform, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 🧹 Delete previous latest-main release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # softprops/action-gh-release@v2 updates the release in place
          # when the tag already exists, but it does NOT move the git tag
          # itself to the new commit. Easiest correct semantics: delete
          # the release + tag, then recreate against the current commit.
          # Both branches are idempotent (|| true) so a fresh repo where
          # neither exists yet doesn't fail the job.
          gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: 🔄 Publish rolling latest-main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: 'Latest main build'
          # Pre-release + make_latest:false belt-and-braces so this
          # doesn't displace the "Latest release" badge on the Releases
          # page (that stays pinned to the most recent v* tag).
          prerelease: true
          make_latest: 'false'
          # Not a draft — should be immediately downloadable; the whole
          # point of latest-main is "always-fresh artefacts from the
          # tip of main".
          draft: false
          target_commitish: ${{ github.sha }}
          body: |
            Auto-built from `main` at commit `${{ github.sha }}`.

            Each push to main refreshes this release with fresh
            artefacts across every platform (CLI binaries, Tauri
            desktop installers, Android APK, iOS sim build). For
            stable versioned downloads, use the `v*` tagged releases.

            ### macOS — first launch
            Apps aren't notarised yet (Apple Developer ID, $99/yr,
            not yet wired). On first launch macOS will say
            "TWANGA cannot be opened because Apple cannot check
            it for malicious software". Two ways to allow it:

            - **System Settings** → Privacy & Security → scroll to
              the "Security" section → click **"Open Anyway"** next
              to the TWANGA notice → confirm.
            - **Terminal** (faster): `xattr -d com.apple.quarantine /Applications/TWANGA.app`

            ### Android — sideloading
            APKs are debug-signed (Tauri auto-generated keystore) so
            they're installable but unsuitable for the Play Store.
            Enable "Install unknown apps" for your downloader before
            opening the APK.

            ### iOS
            Simulator-build only until proper signing is wired
            (requires Apple Developer Program). The `.app.tar.gz`
            extracts to a `.app` that can be dragged into the
            iOS Simulator app in Xcode.

            Built: ${{ github.event.head_commit.timestamp }}
          files: dist/*
